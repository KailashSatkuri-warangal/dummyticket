<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20">
  <!-- Flagge Kanadas: rote Seitenbahnen, weisses Feld, Ahornblatt.
       Die Geometrie stammt aus der gemeinfreien Vorlage
       commons.wikimedia.org/wiki/File:Flag_of_Canada_(Pantone).svg
       (Public domain, viewBox 9600x4800). Das amtliche Verhaeltnis ist
       2:1, das Hausformat 30x20 — das weisse Quadrat wird deshalb
       unverzerrt mittig eingepasst und die weisse Bahn oben und unten
       auf volle Hoehe ergaenzt. Das Blatt ist ein Loch im weissen Pfad
       (evenodd), durch das die rote Flaeche darunter scheint. -->
