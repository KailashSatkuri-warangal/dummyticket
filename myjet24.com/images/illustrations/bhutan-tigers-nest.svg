<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 280" fill="none">
  <!-- Card background -->
  <rect width="160" height="280" rx="16" fill="#f5f3ff"/>

  <!-- Sky / mist glow -->
  <ellipse cx="80" cy="90" rx="70" ry="55" fill="#ede9fe"/>

  <!-- CLIFF FACE — dramatic rocky outcrop -->
  <!-- Main cliff mass (left side) -->
  <path d="M0,240 L0,180 L10,165 L8,150 L15,135 L12,115 L20,100 L25,88 L30,95 L28,110 L35,120 L33,140 L38,155 L42,148 L45,160 L48,152 L52,165 L55,158 L58,170 L62,163 L65,175 L68,168 L70,180 L65,200 L60,215 L55,228 L50,240 Z" fill="#c4b5fd" opacity="0.5"/>
  <!-- Cliff detail — right face -->
  <path d="M50,240 L55,228 L60,215 L65,200 L70,180 L68,168 L72,175 L78,185 L82,195 L85,210 L88,225 L90,240 Z" fill="#a78bfa" opacity="0.4"/>

  <!-- CLIFF ROCK TEXTURE — strata lines -->
  <path d="M12,160 Q25,155 35,158 Q45,160 52,157" stroke="#8b5cf6" stroke-width="0.8" opacity="0.35"/>
  <path d="M15,175 Q28,170 40,173 Q50,175 58,172" stroke="#8b5cf6" stroke-width="0.8" opacity="0.3"/>
  <path d="M18,190 Q32,186 45,188 Q55,190 62,187" stroke="#8b5cf6" stroke-width="0.8" opacity="0.25"/>

  <!-- DISTANT MOUNTAINS (background) -->
  <polygon points="85,105 100,65 115,105" fill="#ddd6fe" opacity="0.5"/>
  <polygon points="100,110 118,68 140,110" fill="#ede9fe" opacity="0.6"/>
  <polygon points="110,115 132,72 155,115" fill="#ddd6fe" opacity="0.4"/>
  <!-- Snow caps -->
  <polygon points="100,65 105,72 95,72" fill="white" opacity="0.7"/>
  <polygon points="118,68 123,75 113,75" fill="white" opacity="0.7"/>
  <polygon points="132,72 137,79 127,79" fill="white" opacity="0.6"/>

  <!-- PRAYER FLAGS (top left — the zig-zag string) -->
  <line x1="2" y1="60" x2="40" y2="88" stroke="#a78bfa" stroke-width="0.8" opacity="0.7"/>
  <!-- Individual flags -->
  <rect x="4" y="61" width="6" height="5" rx="0.5" fill="#7c3aed" opacity="0.7"/>
  <rect x="13" y="65" width="6" height="5" rx="0.5" fill="#a78bfa" opacity="0.7"/>
  <rect x="22" y="70" width="6" height="5" rx="0.5" fill="#6d28d9" opacity="0.7"/>
  <rect x="31" y="75" width="6" height="5" rx="0.5" fill="#8b5cf6" opacity="0.7"/>

  <!-- TIGERS NEST MONASTERY — perched on cliff, ~60% height -->
  <!-- Main monastery structure: 3-tiered building on cliff ledge -->
  <!-- Foundation / terrace ledge -->
  <rect x="18" y="105" width="44" height="5" rx="1" fill="#6d28d9"/>

  <!-- Lower building (widest) -->
  <rect x="20" y="82" width="38" height="24" rx="2" fill="#7c3aed"/>
  <!-- Lower building windows -->
  <rect x="24" y="87" width="5" height="7" rx="1" fill="#ddd6fe" opacity="0.7"/>
  <rect x="32" y="87" width="5" height="7" rx="1" fill="#ddd6fe" opacity="0.7"/>
  <rect x="40" y="87" width="5" height="7" rx="1" fill="#ddd6fe" opacity="0.7"/>
  <rect x="48" y="87" width="5" height="7" rx="1" fill="#ddd6fe" opacity="0.7"/>
  <!-- Lower building roof (curved Buddhist style) -->
  <path d="M18,82 Q39,74 60,82" fill="#5b21b6" stroke="none"/>

  <!-- Middle building (slightly narrower) -->
  <rect x="24" y="63" width="30" height="21" rx="2" fill="#8b5cf6"/>
  <!-- Middle building windows -->
  <rect x="28" y="68" width="5" height="7" rx="1" fill="#ede9fe" opacity="0.6"/>
  <rect x="36" y="68" width="5" height="7" rx="1" fill="#ede9fe" opacity="0.6"/>
  <rect x="44" y="68" width="5" height="7" rx="1" fill="#ede9fe" opacity="0.6"/>
  <!-- Middle roof -->
  <path d="M22,63 Q39,55 56,63" fill="#6d28d9" stroke="none"/>

  <!-- Upper tower (narrowest) -->
  <rect x="30" y="46" width="18" height="18" rx="2" fill="#a78bfa"/>
  <!-- Upper windows -->
  <rect x="33" y="50" width="4" height="6" rx="1" fill="#f5f3ff" opacity="0.6"/>
  <rect x="41" y="50" width="4" height="6" rx="1" fill="#f5f3ff" opacity="0.6"/>
  <!-- Upper roof -->
  <path d="M28,46 Q39,38 50,46" fill="#7c3aed" stroke="none"/>

  <!-- Spire / finial on top -->
  <line x1="39" y1="38" x2="39" y2="24" stroke="#5b21b6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="39" cy="23" r="2" fill="#5b21b6"/>

  <!-- BRIDGE / ACCESS PATH connecting cliff to monastery -->
  <path d="M62,135 Q65,120 62,110" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6"/>

  <!-- WATERFALL on right cliff face (Bhutan landmark detail) -->
  <path d="M95,100 Q97,120 95,140 Q93,160 95,175" stroke="#c4b5fd" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>
  <path d="M98,105 Q100,125 98,145 Q96,162 98,178" stroke="#ddd6fe" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>

  <!-- VALLEY FLOOR -->
  <ellipse cx="80" cy="240" rx="70" ry="8" fill="#ddd6fe" opacity="0.4"/>
  <rect x="0" y="235" width="160" height="10" rx="2" fill="#ede9fe"/>

  <!-- PINE TREES at valley (Bhutan has dense forests) -->
  <polygon points="105,235 110,210 115,235" fill="#7c3aed" opacity="0.5"/>
  <polygon points="118,235 123,215 128,235" fill="#8b5cf6" opacity="0.45"/>
  <polygon points="130,235 135,218 140,235" fill="#7c3aed" opacity="0.4"/>
  <polygon points="142,235 146,222 150,235" fill="#a78bfa" opacity="0.4"/>

  <!-- Decorative sparkles (stars/mist) -->
  <circle cx="135" cy="50" r="2" fill="#a78bfa" opacity="0.5"/>
  <circle cx="148" cy="80" r="1.5" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="10" cy="45" r="1.5" fill="#a78bfa" opacity="0.4"/>

  <!-- LABEL -->
  <text x="80" y="256" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="700" fill="#5b21b6">Tiger's Nest</text>
  <text x="80" y="269" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="9.5" fill="#7c3aed" opacity="0.85">Paro Taktsang · Bhutan</text>
</svg>
