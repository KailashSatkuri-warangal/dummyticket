<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 280" fill="none">
  <!-- Card background -->
  <rect width="160" height="280" rx="16" fill="#f5f3ff"/>

  <!-- Background glow circle -->
  <ellipse cx="80" cy="145" rx="68" ry="55" fill="#ede9fe"/>

  <!-- ═══ LOUVRE BUILDING WINGS ═══ -->

  <!-- LEFT WING — main facade -->
  <rect x="6" y="148" width="48" height="52" rx="3" fill="#ddd6fe"/>
  <!-- Left wing windows row 1 -->
  <rect x="10" y="155" width="9" height="13" rx="1.5" fill="#c4b5fd"/>
  <rect x="23" y="155" width="9" height="13" rx="1.5" fill="#c4b5fd"/>
  <rect x="36" y="155" width="9" height="13" rx="1.5" fill="#c4b5fd"/>
  <!-- Left wing windows row 2 -->
  <rect x="10" y="175" width="9" height="13" rx="1.5" fill="#c4b5fd"/>
  <rect x="23" y="175" width="9" height="13" rx="1.5" fill="#c4b5fd"/>
  <rect x="36" y="175" width="9" height="13" rx="1.5" fill="#c4b5fd"/>
  <!-- Left wing cornice -->
  <rect x="4" y="143" width="52" height="8" rx="2" fill="#a78bfa"/>
  <!-- Left wing roof dormers -->
  <polygon points="12,143 16,135 20,143" fill="#8b5cf6"/>
  <polygon points="26,143 30,135 34,143" fill="#8b5cf6"/>
  <polygon points="40,143 44,135 48,143" fill="#8b5cf6"/>

  <!-- RIGHT WING — main facade -->
  <rect x="106" y="148" width="48" height="52" rx="3" fill="#ddd6fe"/>
  <!-- Right wing windows row 1 -->
  <rect x="110" y="155" width="9" height="13" rx="1.5" fill="#c4b5fd"/>
  <rect x="123" y="155" width="9" height="13" rx="1.5" fill="#c4b5fd"/>
  <rect x="136" y="155" width="9" height="13" rx="1.5" fill="#c4b5fd"/>
  <!-- Right wing windows row 2 -->
  <rect x="110" y="175" width="9" height="13" rx="1.5" fill="#c4b5fd"/>
  <rect x="123" y="175" width="9" height="13" rx="1.5" fill="#c4b5fd"/>
  <rect x="136" y="175" width="9" height="13" rx="1.5" fill="#c4b5fd"/>
  <!-- Right wing cornice -->
  <rect x="104" y="143" width="52" height="8" rx="2" fill="#a78bfa"/>
  <!-- Right wing roof dormers -->
  <polygon points="112,143 116,135 120,143" fill="#8b5cf6"/>
  <polygon points="126,143 130,135 134,143" fill="#8b5cf6"/>
  <polygon points="140,143 144,135 148,143" fill="#8b5cf6"/>

  <!-- ═══ COURTYARD PLAZA ═══ -->
  <rect x="52" y="195" width="56" height="5" rx="2" fill="#ddd6fe"/>

  <!-- Small pool / fountain (circular) -->
  <circle cx="80" cy="210" r="10" stroke="#c4b5fd" stroke-width="1.5" fill="#ede9fe"/>
  <circle cx="80" cy="210" r="5" fill="#ddd6fe"/>

  <!-- ═══ GLASS PYRAMID — main feature ═══ -->
  <!-- Pyramid base platform -->
  <rect x="50" y="193" width="60" height="6" rx="1.5" fill="#7c3aed"/>

  <!-- Pyramid main filled triangle (semi-transparent glass) -->
  <polygon points="80,100 50,196 110,196" fill="#a78bfa" opacity="0.75"/>

  <!-- Pyramid strong outline -->
  <polygon points="80,100 50,196 110,196" stroke="#7c3aed" stroke-width="2.5" fill="none"/>

  <!-- Pyramid glass grid — horizontal lines (diminishing as they go up) -->
  <line x1="57" y1="185" x2="103" y2="185" stroke="#5b21b6" stroke-width="1" opacity="0.55"/>
  <line x1="63" y1="173" x2="97" y2="173" stroke="#5b21b6" stroke-width="1" opacity="0.5"/>
  <line x1="68" y1="160" x2="92" y2="160" stroke="#5b21b6" stroke-width="1" opacity="0.45"/>
  <line x1="73" y1="147" x2="87" y2="147" stroke="#5b21b6" stroke-width="1" opacity="0.4"/>
  <line x1="76" y1="135" x2="84" y2="135" stroke="#5b21b6" stroke-width="0.8" opacity="0.35"/>
  <line x1="78" y1="122" x2="82" y2="122" stroke="#5b21b6" stroke-width="0.8" opacity="0.3"/>

  <!-- Pyramid diagonal ribs from apex to base corners -->
  <!-- Left diagonal -->
  <line x1="80" y1="100" x2="50" y2="196" stroke="#5b21b6" stroke-width="1.2" opacity="0.4"/>
  <!-- Right diagonal -->
  <line x1="80" y1="100" x2="110" y2="196" stroke="#5b21b6" stroke-width="1.2" opacity="0.4"/>
  <!-- Center vertical -->
  <line x1="80" y1="100" x2="80" y2="196" stroke="#5b21b6" stroke-width="1" opacity="0.35"/>

  <!-- Sub-diagonals left panel -->
  <line x1="80" y1="100" x2="63" y2="173" stroke="#5b21b6" stroke-width="0.8" opacity="0.25"/>
  <line x1="80" y1="100" x2="57" y2="185" stroke="#5b21b6" stroke-width="0.8" opacity="0.25"/>

  <!-- Sub-diagonals right panel -->
  <line x1="80" y1="100" x2="97" y2="173" stroke="#5b21b6" stroke-width="0.8" opacity="0.25"/>
  <line x1="80" y1="100" x2="103" y2="185" stroke="#5b21b6" stroke-width="0.8" opacity="0.25"/>

  <!-- Highlight reflection on pyramid face -->
  <polygon points="80,100 76,140 84,140" fill="white" opacity="0.18"/>

  <!-- Decorative sparkles -->
  <circle cx="22" cy="38" r="2.5" fill="#a78bfa" opacity="0.5"/>
  <circle cx="142" cy="28" r="1.8" fill="#c4b5fd" opacity="0.4"/>
  <circle cx="15" cy="100" r="1.2" fill="#a78bfa" opacity="0.35"/>
  <circle cx="148" cy="115" r="1.5" fill="#c4b5fd" opacity="0.35"/>

  <!-- Label -->
  <text x="80" y="237" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="#5b21b6">Musée du Louvre</text>
  <text x="80" y="253" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#7c3aed" opacity="0.8">Paris · France</text>
</svg>
