<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20">
  <!-- India flag: three horizontal bands — saffron, white, India green -->
  <rect width="30" height="6.67" fill="#FF9933"/>
  <rect y="6.67" width="30" height="6.67" fill="#FFFFFF"/>
  <rect y="13.33" width="30" height="6.67" fill="#138808"/>
  <!-- Ashoka Chakra: navy blue wheel with 24 spokes, centred on white band -->
  <circle cx="15" cy="10" r="2.6" fill="none" stroke="#000080" stroke-width="0.55"/>
  <circle cx="15" cy="10" r="0.55" fill="#000080"/>
  <!-- 24 spokes at 15° intervals -->
  <g stroke="#000080" stroke-width="0.28" stroke-linecap="round">
    <line x1="15" y1="7.55" x2="15" y2="8.3"/>
    <line x1="16.24" y1="7.87" x2="15.93" y2="8.56"/>
    <line x1="17.13" y1="8.87" x2="16.59" y2="9.37"/>
    <line x1="17.45" y1="10.11" x2="16.7" y2="10.11"/>
    <line x1="17.13" y1="11.35" x2="16.59" y2="10.85"/>
    <line x1="16.24" y1="12.13" x2="15.93" y2="11.44"/>
    <line x1="15" y1="12.45" x2="15" y2="11.7"/>
    <line x1="13.76" y1="12.13" x2="14.07" y2="11.44"/>
    <line x1="12.87" y1="11.35" x2="13.41" y2="10.85"/>
    <line x1="12.55" y1="10.11" x2="13.3" y2="10.11"/>
    <line x1="12.87" y1="8.87" x2="13.41" y2="9.37"/>
    <line x1="13.76" y1="7.87" x2="14.07" y2="8.56"/>
    <!-- intermediate 12 spokes -->
    <line x1="15.63" y1="7.58" x2="15.47" y2="8.32"/>
    <line x1="16.83" y1="8.26" x2="16.2" y2="8.81"/>
    <line x1="17.37" y1="9.45" x2="16.65" y2="9.72"/>
    <line x1="17.37" y1="10.77" x2="16.65" y2="10.5"/>
    <line x1="16.83" y1="11.74" x2="16.2" y2="11.29"/>
    <line x1="15.63" y1="12.42" x2="15.47" y2="11.9"/>
    <line x1="14.37" y1="12.42" x2="14.53" y2="11.9"/>
    <line x1="13.17" y1="11.74" x2="13.8" y2="11.29"/>
    <line x1="12.63" y1="10.77" x2="13.35" y2="10.5"/>
    <line x1="12.63" y1="9.45" x2="13.35" y2="9.72"/>
    <line x1="13.17" y1="8.26" x2="13.8" y2="8.81"/>
    <line x1="14.37" y1="7.58" x2="14.53" y2="8.32"/>
  </g>
</svg>
